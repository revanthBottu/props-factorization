dim_actions: 6
dim_states: 26
max_traj_count: 1000
max_traj_length: 250
template_dir: agent/policy/templates
llm_si_template_name: num_optim.j2
llm_output_conversion_template_name: num_optim.j2
llm_model_name: asu/gemma4-31b-it
num_evaluation_episodes: 1
warmup_episodes: 1
warmup_dir: null
bias: false
optimum: 140
search_step_size: 0.5
parameter_min: -50.0
parameter_max: 50.0
parameter_decimals: 2
task_context: >-
  This is a 26-by-6 linear policy for a deterministic robot golf shot. The
  six action columns are torques for UR5 joints 0 through 5, clipped to their
  URDF effort limits. Matrix weights are listed in row-major order. Rows 0-4
  are five equal generic episode-time bins. Rows 5-10 are gravity/dynamics
  values, rows 11-16 are angles from the all-zero reset, and rows 17-22 are
  speeds for joints 0-5. Rows 23-25 are the world XYZ displacement from the
  club-face center to the ball. No target pose, inverse kinematics, selected
  swing joint, or trajectory is supplied. Contact, ball launch speed, launch
  direction, central impact, resting cup distance, and sinking determine shot
  reward. A capped eight-point signal tracks normalized best club-head
  approach. Action changes and sustained torque subtract reward. Every robot
  or club collision other than club-head/ball contact is a serious safety
  failure: each new geometry pair costs 20 points, sustained contact costs 50
  points per second, and the total collision penalty is capped at 250. Rollout
  diagnostics identify the colliding geometry pairs. The warmup only
  compensates dynamics and damps motion. Discover positioning and swing by
  changing the complete matrix. Return the complete matrix, not factors.
use_factorized_policy: false
seed: 42
